name: Bug report
description: Something doesn't work, or works in a confusing way.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Plain words are fine: say what you did, what you heard, and what you expected.
        Please don't include personal information, photos of private documents, or your API key.
        For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did the app do or say?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Text chat
        2. Press Find page
        3. ...
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings shows it near the bottom.
      placeholder: "2.4.1"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
  - type: dropdown
    id: screen-reader
    attributes:
      label: Screen reader
      options:
        - TalkBack
        - Another screen reader
        - None
  - type: dropdown
    id: ai
    attributes:
      label: Where do the AI answers come from?
      options:
        - The model on the phone
        - My OpenAI key
        - No AI set up
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Settings that matter (Preview, Live text, Speak with screen reader), or logs with personal data removed.
