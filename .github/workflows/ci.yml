name: Build

# Every pull request and every push to main: the app builds and its unit tests
# pass. No secrets: this is the dev flavor, debug-signed, the same build a
# clone of this repo makes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The wrapper runs whatever gradle-wrapper.jar the repository carries, so
      # it is checked against the official checksums before it is run.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDevDebug testDevDebugUnitTest --no-daemon
