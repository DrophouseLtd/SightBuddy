name: Build

# Every pull request and every push to main: the app builds, its unit tests
# pass, and lint finds nothing new (issues already present are listed in
# app/lint-baseline.xml). No secrets: this is the dev flavor, debug-signed,
# the same build a clone of this repo makes. A fixed bug keeps its test
# here, so it cannot come back unnoticed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The wrapper runs whatever gradle-wrapper.jar the repository carries, so
      # it is checked against the official checksums before it is run.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The sherpa-onnx runtime is fetched and checked against its published
      # checksum by the build itself (downloadSherpaOnnx); cache it.
      - uses: actions/cache@v4
        with:
          path: app/libs/*.aar
          key: sherpa-${{ hashFiles('app/build.gradle.kts') }}

      - name: Build, test and lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDevDebug testDevDebugUnitTest lintDevDebug --no-daemon

      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-devDebug.*
          retention-days: 7
