name: Build & Sign Production AAB

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  build:
    name: Build prodRelease AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Build prodRelease AAB + arm64 APK
        env:
          # Backend decommissioned (BYOK, fully on-device) — no Supabase config.
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleProdRelease assembleProdRelease --no-daemon

      # Published as release assets rather than Actions artifacts: release
      # storage is unlimited and free, and these are the files we ship anyway
      # (AAB → Play, APK → direct download).
      - name: Publish build to CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_SHA::7}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "CI build $TAG" \
                 --notes "Automated prodRelease build from ${GITHUB_SHA}."
          gh release upload "$TAG" \
            app/build/outputs/bundle/prodRelease/*.aab \
            app/build/outputs/apk/prod/release/*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
