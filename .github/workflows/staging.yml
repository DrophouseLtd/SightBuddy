name: Build & Sign Production AAB

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  build:
    name: Build prodRelease AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Build prodRelease AAB
        env:
          # Backend decommissioned (v2.0.0, fully local app) — no Supabase config.
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleProdRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: sightbuddy-${{ github.sha }}
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 30
          if-no-files-found: error
